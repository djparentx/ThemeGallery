name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TG_VERSION: v1.0.4  # bump per release; the Release tag must match

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in debian:buster (glibc 2.28)
        run: docker run --rm -e TG_VERSION -v "$PWD":/src -w /src debian:buster bash ci/build.sh

      - uses: actions/upload-artifact@v7
        with:
          path: ThemeGallery.zip
          archive: false